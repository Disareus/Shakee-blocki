plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files("../fabric-26.1.2/libs/sodium-fabric-0.9.1+mc26.1.2.jar")
    compileOnly files("../fabric-26.1.2/libs/cloth-config-26.1.154.jar")
    compileOnly files("../fabric-26.1.2/libs/modmenu-18.0.0.jar")
}

def modVersion = project.version.toString()

// Builds the unified jar that runs on Minecraft 26.1.2 through 26.3:
//  - base classes + resources from this module (compiled against MC 26.3)
//  - plus the compat261 classes, compiled against MC 26.1.2 in :fabric-26.1.2
// Version-specific mixins/adapters are selected at runtime by ShakeeMixinPlugin.
// Builds the unified jar that runs on Minecraft 26.1.2 through 26.3:
//  - base classes + resources from this module (compiled against MC 26.3)
//  - plus the compat261 classes, compiled against MC 26.1.2 in :fabric-26.1.2
// MC 26.x ships unobfuscated, so production and development share the Mojang
// mapping namespace and no remapping step is needed. Version-specific mixins and
// adapters are selected at runtime by ShakeeMixinPlugin.
tasks.register('unifiedJar', Zip) {
    group = 'build'
    description = 'Assembles the single release jar covering Minecraft 26.1.2-26.3.'
    def remapJarTask = tasks.named('jar')
    dependsOn remapJarTask
    def compatRemapJar = findProject(':fabric-26.1.2')?.tasks?.named('jar')
    if (compatRemapJar != null && compatRemapJar.isPresent()) {
        mustRunAfter compatRemapJar
        dependsOn compatRemapJar
    }
    archiveBaseName = 'shakee_blocki-26.x'
    archiveClassifier = ''
    archiveExtension = 'jar'
    archiveVersion = "${modVersion}".toString()
    destinationDirectory = layout.buildDirectory.dir('libs')
    from { zipTree(remapJarTask.get().archiveFile.get().asFile) }
    if (compatRemapJar != null) {
        from { zipTree(compatRemapJar.get().archiveFile.get().asFile) } {
            // Only the Minecraft 26.1.x-specific classes; duplicates (shared classes,
            // fabric.mod.json, mixins.json) are resolved in favor of the 26.3 base.
            include 'com/shakeeblocki/compat261/**'
            include 'com/shakeeblocki/mixin/WorldRendererOutlineMixin261.class'
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    main {
        java {
            srcDir "../common/src/main/java"
            // Shared render pipeline for the 26.1.2-26.3 unified jar.
            srcDir "../common26/src/main/java"
        }
        resources {
            srcDir "../common/src/main/resources"
        }
    }
}
